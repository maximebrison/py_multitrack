[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-multitrack"
version = "v0.1.0-alpha"
authors = [{ name="Maxime Brison" },]
description = "Multitrack Framework to bridge serial radios to the Multitrack Core tracking system"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0"

[projects.urls]
Homepage = "https://github.com/maximebrison/py_multitrack"
Issues = "https://github.com/maximebrison/py_multitrack/issues"